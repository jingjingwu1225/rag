name: CI

# Runs on every PR and on pushes to main. Deliberately does NOT deploy or
# touch AWS state — deploy.yml owns that. This workflow only answers "is this
# change safe to merge?"
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # match the Dockerfile, not the dev machine
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # No network and no API key: the suite mocks the model and stubs the
        # agent, so it runs in seconds and can't be flaky on OpenAI's uptime.
        run: pytest tests/ -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the tip

      - name: Scan for committed secrets
        # The official gitleaks-action fails here with "stderr is not empty"
        # while parsing git output. Running the upstream image directly does
        # the same scan without the wrapper's fragility, and pins the version.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --no-banner --redact --verbose

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Build only — no push. Proves the Dockerfile still works before merge.
        run: docker build -t rag-api:ci .

      - name: Assert no secrets baked into the image
        # .dockerignore is the control that keeps .env out. This asserts the
        # control actually worked rather than trusting it.
        run: |
          if docker run --rm rag-api:ci sh -c 'test -f /app/.env'; then
            echo "::error::.env is present inside the image"
            exit 1
          fi
          echo "confirmed: no .env in image"

      - name: Assert container runs as non-root
        run: |
          UID_IN_IMAGE=$(docker run --rm rag-api:ci id -u)
          if [ "$UID_IN_IMAGE" = "0" ]; then
            echo "::error::container runs as root"
            exit 1
          fi
          echo "confirmed: runs as uid $UID_IN_IMAGE"

      - name: Smoke test — the container must actually start
        run: |
          # Building an image proves it builds, not that it runs. A module
          # missing from the Dockerfile's COPY passes every other check here
          # and then crashes on startup in production — which is exactly what
          # happened with cache.py. Starting it catches that class of bug.
          #
          # A dummy key is enough: startup validates that the variable is set
          # and warms the baked-in index, without making any OpenAI calls.
          docker run -d --name smoke \
            -e OPENAI_API_KEY=sk-dummy-for-startup-check \
            -p 8000:8000 rag-api:ci

          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health > /dev/null; then
              echo "container healthy after ${i}s"
              READY=$(curl -sf localhost:8000/ready)
              echo "$READY"
              # Assert the corpus actually loaded — an empty collection does
              # not error at query time, it just answers "I don't know".
              echo "$READY" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['corpus_chunks'] > 0, f'empty corpus: {d}'
          print(f\"corpus_chunks={d['corpus_chunks']}\")
          "
              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::container never became healthy"
          docker logs smoke
          docker rm -f smoke > /dev/null
          exit 1

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        # -backend=false: validation needs no credentials and no state access,
        # so PRs from forks can run it safely.
        run: |
          terraform init -backend=false -input=false
          terraform validate
