[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["chroma_db", ".venv", "infra"]

[tool.ruff.lint]
# Explicit ruleset rather than ruff's defaults, so what CI enforces is a
# decision rather than whatever the tool happens to ship with.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — real bugs: undefined names, unused imports
    "I",    # import sorting
    "B",    # bugbear — mutable defaults, late-binding closures
    "C4",   # comprehension simplifications
    "UP",   # pyupgrade
    "PERF", # obvious performance mistakes
    "RUF",  # ruff's own rules
]

ignore = [
    "E501", # line length is handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use broad asserts and fixtures that trip some rules.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet, fast, and no network — the suite mocks the model and stubs the agent.
addopts = "-q"
